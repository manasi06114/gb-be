services:
  - type: web
    name: gridbricks-backend
    runtime: python
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SERVE_FRONTEND
        value: false
      - key: DATA_DIR
        value: data/snapshot
      - key: DELIVERY_START
        value: '2026-01-01'
      - key: DELIVERY_END
        value: '2026-01-31'
      - key: DEFAULT_CUTOFF
        value: '09:00'
      - key: CUTOFF_TIMEZONE
        value: Europe/London
      - key: AVAILABLE_CUTOFFS
        value: '[\"06:00\",\"09:00\",\"10:00\",\"12:00\"]'
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: CHUNK_DAYS
        value: '7'
      - key: FORECAST_LOOKBACK_DAYS
        value: '10'
    healthCheckPath: /api/health
